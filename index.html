<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun With Free Fire - Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #FF6B00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 0, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(51, 0, 102, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(10, 10, 25, 0.98);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(255, 107, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 45px;
            border: 3px solid;
            border-image: linear-gradient(135deg, #FF6B00, #FF9500, #FF6B00) 1;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #FF6B00;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(255, 107, 0, 0.7), 0 0 60px rgba(255, 107, 0, 0.4);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0, 200, 255, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            position: relative;
            top: 2px;
        }

        .tab-btn.active {
            color: #FF6B00;
            border-bottom-color: #FF6B00;
            text-shadow: 0 0 10px rgba(255, 107, 0, 0.5);
            font-weight: 700;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #FF9500;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 107, 0, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6B00;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.5), inset 0 0 10px rgba(255, 107, 0, 0.1);
            background: rgba(0, 0, 0, 0.7);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            border: 2px solid #FF6B00;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px rgba(255, 107, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #FF7A1A, #FFA500);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(0, 200, 0, 0.2);
            border: 1px solid rgba(0, 200, 0, 0.5);
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: rgba(200, 0, 0, 0.2);
            border: 1px solid rgba(200, 0, 0, 0.5);
            color: #ff6b6b;
            display: block;
        }

        .message.info {
            background: rgba(0, 150, 255, 0.2);
            border: 1px solid rgba(0, 150, 255, 0.5);
            color: #00d4ff;
            display: block;
        }

        .footer-text {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-top: 20px;
        }

        .footer-text a {
            color: #00d4ff;
            cursor: pointer;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .loader {
            display: none;
            text-align: center;
            color: #00d4ff;
        }

        .spinner {
            border: 3px solid rgba(0, 200, 255, 0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-info {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.15) 0%, rgba(51, 0, 102, 0.15) 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 107, 0, 0.3);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .user-info p {
            color: #ddd;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .user-info strong {
            color: #FF6B00;
            font-weight: 900;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(200, 0, 0, 0.3);
            border: 1px solid rgba(200, 0, 0, 0.6);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-logout:hover {
            background: rgba(200, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Fun With Free Fire</h1>
            <p>Registration & Login System</p>
        </div>

        <div id="messageBox" class="message"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('signup')">Sign Up</button>
            <button class="tab-btn" onclick="switchTab('login')">Log In</button>
        </div>

        <!-- Sign Up Form -->
        <div id="signup" class="form-section active">
            <form id="signupForm">
                <div class="form-group">
                    <label for="displayName">Player Name *</label>
                    <input type="text" id="displayName" placeholder="Enter your gaming name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email *</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number (For Withdrawals) *</label>
                    <input type="tel" id="phoneNumber" placeholder="9876543210" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password *</label>
                    <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="loader" id="signupLoader">
                    <div class="spinner"></div>
                    <p>Creating account...</p>
                </div>

                <button type="submit" class="btn-register" id="signupBtn">Create Account</button>
            </form>
        </div>

        <!-- Login Form -->
        <div id="login" class="form-section">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email *</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password *</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <div class="loader" id="loginLoader">
                    <div class="spinner"></div>
                    <p>Logging in...</p>
                </div>

                <button type="submit" class="btn-register" id="loginBtn">Log In</button>
            </form>
        </div>

        <!-- User Dashboard (After Login) -->
        <div id="dashboard" class="form-section">
            <div class="user-info">
                <p>👤 Player Name: <strong id="playerNameDisplay">-</strong></p>
                <p>📧 Email: <strong id="playerEmailDisplay">-</strong></p>
                <p>📱 Phone: <strong id="playerPhoneDisplay">-</strong></p>
                <p>🎮 Account Created: <strong id="playerDateDisplay">-</strong></p>
                <p>💰 Wallet Balance: <strong id="walletBalanceDisplay">₹0</strong></p>
            </div>

            <!-- Add Game Result Section -->
            <div class="user-info" style="margin-top:20px;">
                <p>🕹️ Add Game Result</p>

                <div class="form-group">
                    <label for="gameMode">Game Mode</label>
                    <select id="gameMode" style="width:100%;padding:10px;border-radius:8px;border:2px solid rgba(255,107,0,0.4);background:rgba(0,0,0,0.6);color:#fff;">
                        <option value="Solo">Solo</option>
                        <option value="Duo">Duo</option>
                        <option value="Squad">Squad</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="kills">Kills</label>
                    <input type="number" id="kills" placeholder="Total kills" min="0">
                </div>

                <div class="form-group">
                    <label for="placement">Placement</label>
                    <input type="number" id="placement" placeholder="Rank (1,2,3...)" min="1">
                </div>

                <div class="form-group">
                    <label for="isWin">Result</label>
                    <select id="isWin" style="width:100%;padding:10px;border-radius:8px;border:2px solid rgba(255,107,0,0.4);background:rgba(0,0,0,0.6);color:#fff;">
                        <option value="true">Win</option>
                        <option value="false">Loss</option>
                    </select>
                </div>

                <button class="btn-register" id="saveMatchBtn" type="button">Save Match</button>
            </div>

            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="footer-text">
            <p>🔒 This is a test registration system</p>
            <p style="margin-top: 10px; font-size: 12px; color: #666;">Firebase is storing your data securely</p>
        </div>
    </div>

    <!-- Firebase SDK v11 - Latest -->
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

    <script>
        // ✅ FIREBASE CONFIG - सभी values add हैं!
        const firebaseConfig = {
            apiKey: "AIzaSyD0EOrBi_i8mBO-cmq38lL10IgTzluh5UI",
            authDomain: "fun-with-free-fire.firebaseapp.com",
            projectId: "fun-with-free-fire",
            storageBucket: "fun-with-free-fire.firebasestorage.app",
            messagingSenderId: "664963840338",
            appId: "1:664963840338:web:7094a4747b82c31174228b",
            measurementId: "G-K2CXNP543C"
        };

        // Initialize Firebase
        let firebaseInitialized = false;
        try {
            firebase.initializeApp(firebaseConfig);
            firebaseInitialized = true;
            console.log('✅ Firebase Initialized Successfully!');
        } catch (e) {
            console.log('Firebase error:', e.message);
        }

        let auth, db;
        if (firebaseInitialized) {
            auth = firebase.auth();
            db = firebase.firestore();
        }

        // Message Display Function
        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = 'message ' + type;
            setTimeout(() => {
                messageBox.className = 'message';
            }, 5000);
        }

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Sign Up
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!firebaseInitialized) {
                showMessage('❌ Firebase not initialized!', 'error');
                return;
            }

            const displayName = document.getElementById('displayName').value;
            const email = document.getElementById('signupEmail').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('❌ पासवर्ड match नहीं करते!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ पासवर्ड कम से कम 6 characters का होना चाहिए!', 'error');
                return;
            }

            document.getElementById('signupLoader').style.display = 'block';
            document.getElementById('signupBtn').disabled = true;

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const userId = userCredential.user.uid;

                await userCredential.user.updateProfile({ displayName: displayName });

                await db.collection('users').doc(userId).set({
                    uid: userId,
                    name: displayName,
                    email: email,
                    phoneNumber: phoneNumber,
                    totalGamesPlayed: 0,
                    totalWins: 0,
                    winRate: '0%',
                    wallet: {
                        balance: 0,
                        totalAdded: 0,
                        totalWithdrawn: 0
                    },
                    kycVerified: false,
                    createdAt: new Date(),
                    profilePhoto: ''
                });

                showMessage('✅ Account successfully created! आप logged in हो गए!', 'success');
                
                setTimeout(() => {
                    displayUserDashboard(userCredential.user);
                }, 1500);

            } catch (error) {
                let errorMsg = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = '❌ यह email पहले से register है!';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = '❌ Invalid email format!';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = '❌ पासवर्ड बहुत कमजोर है!';
                }
                showMessage(errorMsg, 'error');
            } finally {
                document.getElementById('signupLoader').style.display = 'none';
                document.getElementById('signupBtn').disabled = false;
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!firebaseInitialized) {
                showMessage('❌ Firebase not initialized!', 'error');
                return;
            }

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            document.getElementById('loginLoader').display = 'block';
            document.getElementById('loginBtn').disabled = true;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showMessage('✅ Login successful! स्वागत है!', 'success');
                displayUserDashboard(userCredential.user);
            } catch (error) {
                let errorMsg = '❌ Login failed!';
                if (error.code === 'auth/user-not-found') {
                    errorMsg = '❌ User नहीं मिला!';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = '❌ गलत पासवर्ड!';
                }
                showMessage(errorMsg, 'error');
            } finally {
                document.getElementById('loginLoader').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // Display User Dashboard
        async function displayUserDashboard(user) {
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.data();

                document.getElementById('playerNameDisplay').textContent = userData.name || user.displayName;
                document.getElementById('playerEmailDisplay').textContent
