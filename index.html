<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire - Login & Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #FF6B00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(10, 10, 25, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(255, 107, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border: 2px solid rgba(255, 107, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #FF6B00;
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        }

        .header p {
            color: #aaa;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 107, 0, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            position: relative;
            top: 2px;
        }

        .tab-btn.active {
            color: #FF6B00;
            border-bottom-color: #FF6B00;
            text-shadow: 0 0 10px rgba(255, 107, 0, 0.5);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #FF9500;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 107, 0, 0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6B00;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.4);
            background: rgba(0, 0, 0, 0.7);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 0, 0.5);
            background: linear-gradient(135deg, #FF7A1A, #FFA500);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .message.success {
            background: rgba(0, 200, 0, 0.2);
            border: 1px solid rgba(0, 200, 0, 0.5);
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: rgba(200, 0, 0, 0.2);
            border: 1px solid rgba(200, 0, 0, 0.5);
            color: #ff6b6b;
            display: block;
        }

        .loader {
            display: none;
            text-align: center;
            color: #00d4ff;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid rgba(0, 200, 255, 0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Free Fire</h1>
            <p>Gaming Tournament Platform</p>
        </div>

        <div id="messageBox" class="message"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="login" class="form-section active">
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <div class="loader" id="loginLoader">
                    <div class="spinner"></div>
                    <p>Logging in...</p>
                </div>

                <button type="submit" class="btn" id="loginBtn">Log In</button>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div id="signup" class="form-section">
            <form id="signupForm">
                <div class="form-group">
                    <label>Player Name</label>
                    <input type="text" id="displayName" placeholder="Your gaming name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phoneNumber" placeholder="10 digit number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                </div>

                <div class="loader" id="signupLoader">
                    <div class="spinner"></div>
                    <p>Creating account...</p>
                </div>

                <button type="submit" class="btn" id="signupBtn">Create Account</button>
            </form>
        </div>

        <div class="footer-text">
            <p>🔒 Secure Firebase Backend</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0EOrBi_i8mBO-cmq38lL10IgTzluh5UI",
            authDomain: "fun-with-free-fire.firebaseapp.com",
            projectId: "fun-with-free-fire",
            storageBucket: "fun-with-free-fire.firebasestorage.app",
            messagingSenderId: "664963840338",
            appId: "1:664963840338:web:7094a4747b82c31174228b"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Show message
        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = 'message ' + type;
            setTimeout(() => {
                messageBox.className = 'message';
            }, 5000);
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            document.getElementById('loginLoader').style.display = 'block';
            document.getElementById('loginBtn').disabled = true;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showMessage('✅ Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                let msg = '❌ Login failed!';
                if (error.code === 'auth/user-not-found') msg = '❌ User not found!';
                if (error.code === 'auth/wrong-password') msg = '❌ Wrong password!';
                if (error.code === 'auth/invalid-email') msg = '❌ Invalid email!';
                showMessage(msg, 'error');
                document.getElementById('loginLoader').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // SIGNUP
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const displayName = document.getElementById('displayName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('phoneNumber').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('❌ Passwords do not match!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ Password must be at least 6 characters!', 'error');
                return;
            }

            document.getElementById('signupLoader').style.display = 'block';
            document.getElementById('signupBtn').disabled = true;

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;

                await userCredential.user.updateProfile({ displayName: displayName });

                await db.collection('users').doc(uid).set({
                    uid: uid,
                    name: displayName,
                    email: email,
                    phone: phone,
                    bio: '',
                    wallet: {
                        balance: 0,
                        totalAdded: 0,
                        totalWithdrawn: 0
                    },
                    totalGames: 0,
                    totalWins: 0,
                    totalKills: 0,
                    createdAt: new Date()
                });

                showMessage('✅ Account created! Redirecting to dashboard...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = '❌ Email already registered!';
                if (error.code === 'auth/invalid-email') msg = '❌ Invalid email format!';
                if (error.code === 'auth/weak-password') msg = '❌ Password is too weak!';
                showMessage(msg, 'error');
                document.getElementById('signupLoader').style.display = 'none';
                document.getElementById('signupBtn').disabled = false;
            }
        });

        // Auto redirect if already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
